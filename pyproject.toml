[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-maintenance-tasks"
version = "0.1.0.dev0"
description = "Pausable, resumable, throttled data backfills for Django, built on django.tasks."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["Django>=6.0"]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-django"]

[tool.hatch.build.targets.wheel]
packages = ["src/maintenance_tasks"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src", "."]
testpaths = ["tests"]
